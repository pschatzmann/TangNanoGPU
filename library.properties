name=TangNanoGPU
version=0.1.0
author=Phil Schatzmann
maintainer=Phil Schatzmann <phil.schatzmann@gmail.com>
sentence=TinyGPU drawing engine with HDMI output on a Sipeed Tang Nano 20K FPGA, driven over SPI.
paragraph=The Tang Nano 20K keeps a 320x240 RGB565 framebuffer (double buffered) in its SDRAM, renders TinyGPU drawing commands (fills, lines, circles, text masks, sprites, blits, scrolling) in hardware and outputs 640x480@60 DVI/HDMI in the background. The Arduino library provides SurfaceTangNano (a TinyGPU ISurface) and DisplayDriverTangNano (a TinyGPU DisplayDriver, e.g. for LVGL). Gateware (Verilog, open-source yosys/nextpnr/apicula flow) is under gateware/.
category=Display
url=https://github.com/pschatzmann/TangNanoGPU
architectures=*
depends=TinyGPU
includes=TangNanoGPU.h
